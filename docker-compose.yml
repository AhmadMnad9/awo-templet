version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: fast_api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./fast_api:/app
      - uploads_volume:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  uploads_volume:
